<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard DC</title>
    <style>
        /* Reset margin dan padding default browser */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar ganda jika konten iframe panjang */
            background-color: #f0f2f5; /* Warna latar belakang fallback */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Container untuk memastikan iframe memenuhi layar */
        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Gaya untuk iframe itu sendiri */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Menghilangkan border default iframe */
        }
        
        /* Loading indicator (opsional, untuk UX yang lebih baik saat script memuat) */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #555;
            z-index: -1; /* Berada di belakang iframe setelah iframe dimuat */
        }
    </style>
</head>
<body>

    <!-- Indikator loading sederhana -->
    <div id="loader">Memuat Dashboard...</div>

    <!-- Container untuk iframe -->
    <div class="app-container">
        <!-- 
            Ganti atribut 'src' di bawah ini dengan URL Google Apps Script Anda.
            URL Anda saat ini sudah saya masukkan.
        -->
        <iframe 
            id="gas-frame"
            src="https://script.google.com/macros/s/AKfycbwo3PADJHak6Wk0ZU63ULw8aBz1sjLMstkgAWSPJmUZ6bQ8PCHtwm-0vhHpccKevUdB/exec" 
            allowfullscreen="true"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
            onload="document.getElementById('loader').style.display='none';"
        ></iframe>
    </div>

</body>
</html>
